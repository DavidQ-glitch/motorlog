name: Construir APK y publicar actualización

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # necesario para publicar el Release con el APK

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      BUILD: ${{ github.run_number }}
      COMMIT_MSG: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar la clave de firma (Secret KEYSTORE_BASE64)
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error title=Falta la clave de firma::Creá el Secret KEYSTORE_BASE64 (Settings > Secrets and variables > Actions) con el contenido de CLAVE_DE_FIRMA.txt. Mirá el paso 3 de la guía."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KS" | tr -d '[:space:]' | base64 -d > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey > /dev/null \
            || { echo "::error title=Clave de firma inválida::El Secret KEYSTORE_BASE64 no se pudo leer. Pegá de nuevo el contenido completo de CLAVE_DE_FIRMA.txt."; exit 1; }

      - name: Poner número de versión en la app
        run: |
          sed -i "s#__REPO__#${GITHUB_REPOSITORY}#; s#BUILD: 0#BUILD: ${BUILD}#; s#VERSION: '2.0.0'#VERSION: '2.0.${BUILD}'#" www/js/config.js
          cat www/js/config.js | grep -E "REPO|BUILD|VERSION|NATIVE_API"

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Generar íconos y pantalla de inicio
        run: npx capacitor-assets generate --android

      - name: Sincronizar la app con Android
        run: npx cap sync android

      - name: Poner número de versión en el APK
        run: |
          sed -i "s/versionCode 1/versionCode ${BUILD}/; s/versionName \"1.0\"/versionName \"2.0.${BUILD}\"/" android/app/build.gradle
          grep -nE "versionCode|versionName" android/app/build.gradle

      - name: Compilar APK
        working-directory: android
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace > ../gradle.log 2>&1
          CODE=$?
          if [ $CODE -ne 0 ]; then
            # Muestra el motivo del error como anotación (se ve en la página de la ejecución)
            MSG=$( (grep -E -A14 "What went wrong|error:|Execution failed" ../gradle.log | head -n 45) | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Falló Gradle::${MSG}"
            tail -n 60 ../gradle.log
          fi
          exit $CODE

      - name: Preparar archivos de la actualización
        run: |
          mkdir -p salida
          cp android/app/build/outputs/apk/debug/app-debug.apk salida/MotorLog.apk
          (cd www && zip -qr ../salida/bundle.zip .)
          NATIVE=$(grep -oP "NATIVE_API:\s*\K[0-9]+" www/js/config.js)
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${BUILD}"
          NOTES="${COMMIT_MSG:-Mejoras y correcciones}"
          NOTES=$(printf '%s' "$NOTES" | head -n 3)
          printf '%s\n' "$NOTES" > salida/notas.txt
          jq -n \
            --argjson build "$BUILD" \
            --arg version "2.0.${BUILD}" \
            --arg apk "${BASE}/MotorLog.apk" \
            --arg bundle "${BASE}/bundle.zip" \
            --argjson minNative "$NATIVE" \
            --arg notes "$NOTES" \
            '{build:$build, version:$version, apk:$apk, bundle:$bundle, minNative:$minNative, notes:$notes}' > salida/version.json
          cat salida/version.json

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${BUILD}" salida/MotorLog.apk salida/bundle.zip salida/version.json \
            --title "MotorLog 2.0.${BUILD}" \
            --notes-file salida/notas.txt \
            --latest
